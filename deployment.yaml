apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbl3-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pbl3-app
  template:
    metadata:
      labels:
        app: pbl3-app
    spec:
      containers:
        - name: pbl3-app
          image: cloudpulse:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: pbl3-service
spec:
  type: NodePort
  selector:
    app: pbl3-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
